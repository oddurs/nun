name: ci

# A pull request is checked locally before it exists: the pre-push hook runs
# `scripts/task check`, and `scripts/agent merge` re-runs it after a rebase. This
# job is the after-the-fact net for what a Mac cannot see — Linux, a clean
# toolchain, a cold cache. It gates nothing.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: scripts/task check
        run: ./scripts/task check

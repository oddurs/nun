name: ci

# A pull request is checked locally before it exists: the pre-push hook runs
# `scripts/task check`, and `scripts/agent merge` re-runs it after a rebase. This
# job is the after-the-fact net for what a Mac cannot see — Linux, a clean
# toolchain, a cold cache. It gates nothing.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: scripts/task check
        run: ./scripts/task check

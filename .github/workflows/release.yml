name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./scripts/task check

  release:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a hyphen (v0.1.0-alpha.1) is a pre-release, as semver
        # has it, so it is not offered as the latest version.
        run: |
          prerelease=''
          case "${GITHUB_REF_NAME}" in *-*) prerelease='--prerelease' ;; esac
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag $prerelease
